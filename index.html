<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для мамы</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', Courier, monospace;
    color: #fff;
    overflow: hidden;
    background-color: #0d0714;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(219, 112, 147, 0.35) 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(138, 43, 226, 0.30) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255, 182, 193, 0.15) 0%, transparent 60%),
      linear-gradient(135deg, #13091f 0%, #240e2b 50%, #0f0817 100%);
    background-size: 150% 150%;
    animation: gentleFlow 14s ease-in-out infinite alternate;
  }

  @keyframes gentleFlow {
    0% { background-position: 0% 20%; }
    50% { background-position: 100% 60%; }
    100% { background-position: 30% 90%; }
  }

  .prompt-title {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 4px;
    padding-left: 4px;
    margin-bottom: 22px;
    text-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
    animation: bounce 1.5s infinite ease-in-out;
    user-select: none;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .console-box {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 520px;
    min-height: 245px;
    background: rgba(10, 6, 15, 0.88);
    border: 2px solid rgba(255, 182, 193, 0.4);
    border-radius: 20px;
    padding: 25px 35px;
    box-shadow: 
      0 15px 40px rgba(0, 0, 0, 0.7),
      0 0 25px rgba(219, 112, 147, 0.3),
      inset 0 0 15px rgba(255, 182, 193, 0.1);
    user-select: none;
  }

  #matrix-console {
    font-size: 16px;
    line-height: 1.15;
    letter-spacing: 3px;
    padding-left: 3px;
    white-space: pre;
    text-align: center;
  }

  .noise {
    color: rgba(219, 112, 147, 0.35);
  }

  .heart-char {
    color: #ffffff;
    font-weight: bold;
    text-shadow: 0 0 8px #ffffff, 0 0 16px #ff69b4;
  }

  .heart-hitbox {
    position: absolute;
    width: 190px;
    height: 165px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 10;
  }

  .greeting-card {
    display: none;
    position: relative;
    z-index: 20;
    max-width: 480px;
    margin: 0 20px;
    text-align: center;
    background: rgba(25, 14, 36, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 182, 193, 0.45);
    border-radius: 24px;
    padding: 35px 28px;
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.7),
      0 0 30px rgba(219, 112, 147, 0.25);
    animation: fadeIn 0.8s ease forwards;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .greeting-card h1 {
    font-size: 1.9rem;
    margin-bottom: 14px;
    color: #ffb6c1;
    text-shadow: 0 0 12px rgba(255, 182, 193, 0.5);
  }

  .greeting-card p {
    font-size: 1.1rem;
    line-height: 1.6;
    color: #f3e6f5;
  }

  .neon-bow {
    position: absolute;
    top: -32px;
    right: -28px;
    transform: rotate(22deg);
    pointer-events: none;
    z-index: 30;
    filter: 
      drop-shadow(0 0 6px #ffffff)
      drop-shadow(0 0 16px #ff69b4)
      drop-shadow(0 0 28px rgba(255, 182, 193, 0.7));
    animation: bowWiggle 3.5s ease-in-out infinite alternate;
  }

  @keyframes bowWiggle {
    0%   { transform: rotate(20deg) scale(1); }
    100% { transform: rotate(26deg) scale(1.05); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .photos-layer {
    display: none;
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .photo-slot {
    position: absolute;
    opacity: 0;
    transition: all 1.1s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .slot-1 { top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.2); }
  .slot-2 { top: 50%; right: 50%; transform: translate(50%, -50%) scale(0.2); }
  .slot-3 { bottom: 50%; left: 50%; transform: translate(-50%, 50%) scale(0.2); }
  .slot-4 { bottom: 50%; right: 50%; transform: translate(50%, 50%) scale(0.2); }

  .photos-layer.active .slot-1 { top: 10%; left: 6%; opacity: 1; transform: translate(0, 0) scale(1) rotate(-4deg); }
  .photos-layer.active .slot-2 { top: 7%; right: 8%; opacity: 1; transform: translate(0, 0) scale(1) rotate(3deg); transition-delay: 0.15s; }
  .photos-layer.active .slot-3 { bottom: 10%; left: 8%; opacity: 1; transform: translate(0, 0) scale(1) rotate(4deg); transition-delay: 0.3s; }
  .photos-layer.active .slot-4 { bottom: 8%; right: 6%; opacity: 1; transform: translate(0, 0) scale(1) rotate(-3deg); transition-delay: 0.45s; }

  .neon-photo {
    width: 240px;
    height: 165px;
    object-fit: cover;
    border-radius: 16px;
    border: 2px solid #ffffff;
    background-color: #160c21;
    box-shadow: 
      0 0 12px rgba(255, 255, 255, 0.9),
      0 0 28px rgba(255, 255, 255, 0.55),
      0 0 45px rgba(255, 182, 193, 0.4);
    animation: floatSway 4.5s ease-in-out infinite alternate;
  }

  .slot-2 .neon-photo { width: 270px; height: 175px; animation-duration: 5.2s; animation-delay: -1s; }
  .slot-3 .neon-photo { width: 230px; height: 175px; animation-duration: 4.8s; animation-delay: -2s; }
  .slot-4 .neon-photo { width: 260px; height: 170px; animation-duration: 5.5s; animation-delay: -0.5s; }

  @keyframes floatSway {
    0%   { transform: translateY(0px) rotate(-2deg); }
    50%  { transform: translateY(-9px) rotate(1.5deg); }
    100% { transform: translateY(5px) rotate(-1.5deg); }
  }
</style>
</head>
<body>

  <div class="prompt-title" id="title">НАЖМИ ↓</div>
  
  <div class="console-box" id="console-wrapper">
    <div id="matrix-console"></div>
    <div class="heart-hitbox" id="heart-btn" title="Нажми на сердце"></div>
  </div>

  <div class="greeting-card" id="greeting">
    <div class="neon-bow">
      <svg viewBox="0 0 120 90" width="95" height="72" fill="none" xmlns="http://w3.org">
        <path d="M58 42 C 35 12, 8 18, 12 42 C 15 62, 42 54, 58 45" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M62 42 C 85 12, 112 18, 108 42 C 105 62, 78 54, 62 45" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M56 47 C 42 64, 30 74, 22 82" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M64 47 C 78 64, 90 74, 98 82" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="60" cy="44" r="6" fill="#ffb6c1" stroke="#ffffff" stroke-width="3"/>
      </svg>
    </div>

    <h1>Любимая мама! ❤️</h1>
    <p>
      Спасибо тебе за тепло, заботу и бесконечную поддержку. 
      Пусть каждый твой день будет наполнен радостью, улыбками и самыми светлыми моментами!
    </p>
  </div>

  <div class="photos-layer" id="photos-layer">
    <div class="photo-slot slot-1">
      <img src="img/5ef148d1-fb49-4cd1-83b4-f863ecdb7d0f.png" alt="Фото 1" class="neon-photo">
    </div>
    <div class="photo-slot slot-2">
      <img src="img/hqdefault.jpg" alt="Фото 2" class="neon-photo">
    </div>
    <div class="photo-slot slot-3">
      <img src="img/scale_1200.png" alt="Фото 3" class="neon-photo">
    </div>
    <div class="photo-slot slot-4">
      <img src="img/scale_1200.png" alt="Фото 4" class="neon-photo">
    </div>
  </div>

<script>
  var consoleEl = document.getElementById('matrix-console');
  var consoleWrapper = document.getElementById('console-wrapper');
  var heartBtn = document.getElementById('heart-btn');
  var titleEl = document.getElementById('title');
  var greetingEl = document.getElementById('greeting');
  var photosLayer = document.getElementById('photos-layer');

  var chars = ['*', '-', '/', '+', '@', '#', '%', '&', '=', '~'];

  var mask = [
    "0000000000000000000000000000000000000",
    "0000000000001111000001111000000000000",
    "0000000000111111110111111110000000000",
    "0000000001111111111111111111000000000",
    "0000000001111111111111111111000000000",
    "0000000000111111111111111110000000000",
    "0000000000001111111111111000000000000",
    "0000000000000011111111100000000000000",
    "0000000000000000111110000000000000000",
    "0000000000000000001000000000000000000",
    "0000000000000000000000000000000000000"
  ];

  function renderFrame() {
    var html = '';
    for (var row = 0; row < mask.length; row++) {
      for (var col = 0; col < mask[row].length; col++) {
        var ch = chars[Math.floor(Math.random() * chars.length)];
        if (mask[row][col] === '1') {
          html += '<span class="heart-char">' + ch + '</span>';
        } else {
          html += '<span class="noise">' + ch + '</span>';
        }
      }
      html += '\n';
    }
    consoleEl.innerHTML = html;
  }

  renderFrame();
  var interval = setInterval(renderFrame, 90);

  heartBtn.onclick = function() {
    clearInterval(interval);
    titleEl.style.display = 'none';
    consoleWrapper.style.display = 'none';
    greetingEl.style.display = 'block';
    photosLayer.style.display = 'block';
    setTimeout(function() {
      photosLayer.classList.add('active');
    }, 50);
  };
</script>

</body>
</html>
